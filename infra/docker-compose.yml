version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: ai-interviewer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_interviewer
      POSTGRES_PASSWORD: ai_interviewer
      POSTGRES_DB: ai_interviewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_interviewer -d ai_interviewer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
